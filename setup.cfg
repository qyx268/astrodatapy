[metadata]
name = astrodatapy
description = Python tools to collect astronomical data
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Yuxiang Qin
author_email = yuxiang.l.qin@gmail.com
license = BSD 3-Clause
license_files = licenses/LICENSE.rst
url = https://github.com/qyx268/astrodatapy
project_urls =
    Documentation = https://astrodatapy.readthedocs.io
    Source = https://github.com/qyx268/astrodatapy
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Astronomy

[options]
python_requires = >=3.6
packages = find:
# Data files are listed explicitly in [options.package_data] below.
include_package_data = False
zip_safe = False
install_requires =
    numpy
    pandas

[options.packages.find]
include =
    astrodatapy
    astrodatapy.*

[options.package_data]
astrodatapy =
    data/*.*
    data/*/*.*
    data/*/*/*.*
    data/*/*/*/*.*
    utils/*.ipynb

[options.extras_require]
test =
    pytest
# what the example notebooks in astrodatapy/utils need (also used by the notebook tests)
notebooks =
    matplotlib
    scipy
    astropy
    nbformat
    nbclient
    ipykernel
docs =
    sphinx
    sphinx-automodapi
    myst-nb

[tool:pytest]
minversion = 3.0
testpaths = astrodatapy
norecursedirs = build docs/_build

[pycodestyle]
# E101 - mix of tabs and spaces
# W191 - use of tabs
# W291 - trailing whitespace
# W292 - no newline at end of file
# W293 - trailing whitespace
# W391 - blank line at end of file
# E111 - 4 spaces per indentation level
# E112 - 4 spaces per indentation level
# E113 - 4 spaces per indentation level
# E901 - SyntaxError or IndentationError
# E902 - IOError
select = E101,W191,W291,W292,W293,W391,E111,E112,E113,E901,E902
exclude = sphinx,*parsetab.py
